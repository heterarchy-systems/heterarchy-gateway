name: Gateway CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
          enable-cache: false

      - name: Install exact free-threaded Python and locked dependencies
        run: |
          uv python install 3.14.7t
          uv sync --locked --python 3.14.7t

      - name: Restore private harness
        env:
          GATEWAY_PRIVATE_HARNESS_TAR_GZ_B64: ${{ secrets.GATEWAY_PRIVATE_HARNESS_TAR_GZ_B64 }}
          GATEWAY_PRIVATE_HARNESS_SHA256: ${{ secrets.GATEWAY_PRIVATE_HARNESS_SHA256 }}
        shell: bash
        run: |
          uv run --locked --python 3.14.7t python .github/scripts/restore_private_harness.py --destination "$GITHUB_WORKSPACE"

      - name: Run Python runtime, type, guardrail, and regression gates
        run: make check

      - name: Validate local container configuration
        run: make container-config

      - name: Remove private CI material
        if: always()
        shell: bash
        run: |
          rm -rf .agents/python_bff_harness
