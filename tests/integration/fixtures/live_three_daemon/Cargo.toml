forge-persistence = { path = "../../../../../heterarchy-forge/crates/forge-persistence" }
forge-workspace = { path = "../../../../../heterarchy-forge/crates/forge-workspace" }
heterarchy-orchestration-auth = { path = "../../../../../heterarchy-orchestration/crates/heterarchy-orchestration-auth" }
heterarchy-orchestration-backend = { path = "../../../../../heterarchy-orchestration/crates/heterarchy-orchestration-backend" }
heterarchy-orchestration-operations = { path = "../../../../../heterarchy-orchestration/crates/heterarchy-orchestration-operations" }
heterarchy-orchestration-runtime = { path = "../../../../../heterarchy-orchestration/crates/heterarchy-orchestration-runtime" }
heterarchy-orchestration-sessions = { path = "../../../../../heterarchy-orchestration/crates/heterarchy-orchestration-sessions" }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
